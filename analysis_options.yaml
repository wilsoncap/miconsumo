# Configuración del analizador estático.
#
# Activa el conjunto recomendado de lints de Flutter y lo amplía con reglas
# adicionales. El plugin riverpod_lint se instala aquí (no con custom_lint).

include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Código generado: se regenera con build_runner, no se edita ni se revisa a mano.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Reglas adicionales a flutter_lints (R9 del research de la feature 001).
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    # Reglas de estilo que acompañan a la regla de composición de la constitución.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - directives_ordering
    - sort_child_properties_last
    - avoid_print
